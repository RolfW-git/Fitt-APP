<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <!-- Bicycle / Ergometer Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Wheel -->
    <circle cx="140" cy="360" r="70"/>
    <!-- Front Wheel -->
    <circle cx="372" cy="360" r="70"/>
    <!-- Pedal Crank Center -->
    <circle cx="256" cy="360" r="24" fill="#ffffff"/>
    <!-- Frame -->
    <path d="M140 360 L240 220 L372 360"/>
    <path d="M256 360 L320 220"/>
    <path d="M140 360 L256 360"/>
    <path d="M240 220 L200 170"/>
    <!-- Saddle -->
    <path d="M170 170 L230 170" stroke-width="32"/>
    <!-- Handlebar Post & Handlebar -->
    <path d="M320 220 L350 150"/>
    <path d="M325 150 L375 150 L395 180" stroke-width="26"/>
  </g>
</svg>
